<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Calling Tracker</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzLSd_sXClpRUsVYlim08YOP8PbqAOXkCmiKmbmWA5KVyCvsE5YwhFp1ygch67q3fM0/exec"></iframe>

  <script>
    // Listen for tab change events from Google Apps Script inside the iframe
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'CHANGE_TAB') {
        // Updates the parent URL hash without reloading the page
        window.location.hash = event.data.tab;
      }
    });
  </script>
</body>
</html>
